name: Build Android APK

on:
  push:
    branches:
      - main
      - v1.5.0-clean-build
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - v1.5.0-clean-build
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build web assets
        run: pnpm run build
      
      - name: Sync Capacitor
        run: pnpm exec cap sync android
      
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      
      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug
      
      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease
        continue-on-error: true
      
      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' android/app/build.gradle | awk '{print $2}')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
      
      - name: Rename APK files
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/field-enumeration-v${{ steps.version.outputs.version_name }}-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/field-enumeration-v${{ steps.version.outputs.version_name }}-release-unsigned.apk
          fi
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: field-enumeration-debug-apk
          path: apk-output/field-enumeration-v${{ steps.version.outputs.version_name }}-debug.apk
          retention-days: 30
      
      - name: Upload Release APK (if exists)
        uses: actions/upload-artifact@v4
        if: hashFiles('apk-output/*-release-unsigned.apk') != ''
        with:
          name: field-enumeration-release-apk
          path: apk-output/field-enumeration-v${{ steps.version.outputs.version_name }}-release-unsigned.apk
          retention-days: 90
      
      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apk-output/field-enumeration-v${{ steps.version.outputs.version_name }}-debug.apk
            apk-output/field-enumeration-v${{ steps.version.outputs.version_name }}-release-unsigned.apk
          body: |
            ## Field Enumeration v${{ steps.version.outputs.version_name }}
            
            **Build:** ${{ steps.version.outputs.version_code }}
            **Commit:** ${{ github.sha }}
            
            ### Installation
            
            Download the debug APK and install on your Android device:
            ```bash
            adb install -r field-enumeration-v${{ steps.version.outputs.version_name }}-debug.apk
            ```
            
            ### Test Credentials
            - Email: adeyadewuyi@gmail.com
            - Password: 123456
            
            ### Changes
            See commit history for detailed changes.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Comment on PR with APK download link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📱 APK Build Complete\n\n**Version:** ${{ steps.version.outputs.version_name }} (Build ${{ steps.version.outputs.version_code }})\n\nDebug APK is available in the workflow artifacts. Click on "Actions" tab → Select this workflow run → Download "field-enumeration-debug-apk" artifact.`
            })
