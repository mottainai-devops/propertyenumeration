name: Build Android APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build web assets
        run: pnpm run build
      
      - name: Verify Capacitor configuration
        run: |
          echo "Checking capacitor.config.ts..."
          cat capacitor.config.ts
          echo "Checking android directory..."
          ls -la android/
      
      - name: Sync Capacitor
        run: npx cap copy android
      
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew
      
      - name: Build Android APK (Debug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --info
      
      - name: List build outputs
        run: |
          echo "Build outputs:"
          find android/app/build/outputs -type f -name "*.apk"
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: property-enumeration-v1.5.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: Property Enumeration ${{ github.ref_name }}
          body: |
            ## Property Enumeration Mobile App
            
            **Version:** ${{ github.ref_name }}
            **Build:** Debug APK
            
            ### Installation
            1. Download the APK file
            2. Enable "Install from Unknown Sources" on your Android device
            3. Install the APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
